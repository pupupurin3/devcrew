[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devcrew"
version = "0.1.0"
description = "A planner/coder/reviewer agent team for coding tasks, with a benchmark that measures whether it helps."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["anthropic>=1.15,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devcrew = "devcrew.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devcrew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
